name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # Only files that affect the image; docs/compose/env changes don't rebuild
    paths:
      - Dockerfile
      - .github/workflows/deploy.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up Debian security fixes (Mondays 03:17 UTC)
    - cron: '17 3 * * 1'

env:
  VERSION: '3.3.0'
  PATCH: 'p1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set build date
      id: date
      run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

    - name: set up qemu
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64,linux/arm/v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        platforms: linux/amd64,linux/arm64,linux/arm/v7

    - name: Build and push for ARM and AMD64
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        pull: true
        no-cache: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: true
        provenance: false
        tags: |
          ghcr.io/tgcentral/noip-duc:latest
          ghcr.io/tgcentral/noip-duc:${{ env.VERSION }}-${{ env.PATCH }}
          ghcr.io/tgcentral/noip-duc:${{ env.VERSION }}-${{ steps.date.outputs.date }}
